# Pre-commit hooks: https://pre-commit.com
# Install once: pip install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
repos:
  # ---- Backend: ruff (lint + format) ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ---- Frontend: prettier ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude_types: [svg]
      - id: end-of-file-fixer
        exclude_types: [svg]
      - id: check-json
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        files: ^frontend/.*\.(ts|tsx|js|mjs|json|css|md)$
        exclude: (^frontend/package-lock\.json$|\.next/)

