[project]
name = "travel-planner-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "pydantic",
    "structlog",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.13",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-asyncio",
    "ruff"
]
