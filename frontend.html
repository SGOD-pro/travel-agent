<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Premium Travel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <div class="bg-blue-900 text-white py-16 shadow-lg text-center">
        <h1 class="text-4xl font-extrabold mb-4"><i class="fa-solid fa-plane-departure mr-3"></i>AI Travel Architect</h1>
        <p class="text-blue-200 text-lg max-w-2xl mx-auto">Design your perfect journey or let our Agentic AI discover a destination from a video link.</p>
    </div>

    <div class="max-w-4xl mx-auto px-6 py-8 -mt-10">
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-10 border border-gray-100">
            
            <!-- Standard Form (Now uses onsubmit) -->
            <form id="travelForm" class="flex flex-col md:flex-row gap-4 items-end" onsubmit="submitStandardJob(event)">
                <div class="flex-1 w-full">
                    <label class="block text-sm font-semibold text-gray-600 mb-2">Where to?</label>
                    <input type="text" id="destination" required placeholder="e.g., Bhubaneswar to Tokyo" 
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none">
                </div>
                <div class="w-full md:w-32">
                    <label class="block text-sm font-semibold text-gray-600 mb-2">Days</label>
                    <input type="number" id="days" required min="1" max="14" value="5"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none">
                </div>
                <<div class="w-full md:w-40">
                    <label class="block text-sm font-semibold text-gray-600 mb-2">Budget (₹)</label>
                    <input type="number" id="budget" required min="1000" value="50000"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none">
                </div>
                <button type="submit" id="submitBtn"
                    class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl transition duration-300 shadow-lg shadow-blue-200 flex items-center justify-center h-[50px]">
                    <span>Generate Plan</span>
                </button>
            </form>

            <div class="flex items-center py-6">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink-0 mx-4 text-gray-400 text-sm font-bold uppercase">OR LET AI DECIDE</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- Magic Link Form (Now uses onsubmit) -->
            <form id="magicForm" class="flex flex-col md:flex-row gap-4" onsubmit="submitMagicJob(event)">
                <div class="flex-1 w-full">
                    <label class="block text-sm font-semibold text-gray-600 mb-2"><i class="fa-brands fa-youtube text-red-500 mr-2"></i>Paste a Reel or Video Link</label>
                    <input type="url" id="magicUrl" required placeholder="https://en.wikipedia.org/wiki/Kyoto" 
                        class="w-full px-4 py-3 bg-purple-50 border border-purple-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:bg-white outline-none">
                </div>
                <button type="submit" id="magicBtn"
                    class="w-full md:w-auto bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-purple-200 flex items-center justify-center h-[50px]">
                    <span>Inspire Me</span>
                </button>
            </form>
        </div>

        <div id="statusContainer" class="hidden text-center py-8">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-purple-200 border-t-purple-600 mb-4"></div>
            <h3 id="statusText" class="text-xl font-bold text-gray-700">Waking up the AI...</h3>
            <p id="statusSubtext" class="text-gray-500 mt-2">This usually takes 15-30 seconds depending on your hardware.</p>
        </div>

        <div id="itineraryContainer" class="hidden">
            <div id="aiDiscoveryBox"></div>
            <h2 class="text-3xl font-bold text-gray-800 mb-8 border-b pb-4">Your Custom Itinerary</h2>
            <div id="timeline" class="space-y-8 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-1 before:bg-gradient-to-b before:from-transparent before:via-slate-300 before:to-transparent">
            </div>
        </div>
    </div>

    <script>
        function parseAIOutput(rawText) {
            let daysArray = [];
            try {
                const parsed = JSON.parse(rawText);
                for (const [day, desc] of Object.entries(parsed)) {
                    daysArray.push({ day: day.replace(/_/g, ' '), desc: desc });
                }
            } catch (e) {
                const regex = /"(Day\s*\d+)"\s*:\s*"([^"]+)"/ig;
                let match;
                while ((match = regex.exec(rawText)) !== null) {
                    daysArray.push({ day: match[1], desc: match[2] });
                }
                if (daysArray.length === 0) daysArray.push({ day: "Overview", desc: rawText });
            }
            return daysArray;
        }

        function startPolling(jobId, btnElement, defaultBtnText) {
            const statusText = document.getElementById('statusText');
            const statusChecker = setInterval(async () => {
                try {
                    const statusRes = await fetch(`http://localhost:8000/api/jobs/${jobId}`);
                    if (!statusRes.ok) throw new Error("Backend connection failed.");
                    
                    const statusData = await statusRes.json();

                    if (statusData.status === "COMPLETED") {
                        clearInterval(statusChecker);
                        
                        if (statusData.destination !== "UNKNOWN" && defaultBtnText === "Inspire Me") {
                            document.getElementById('aiDiscoveryBox').innerHTML = `
                                <div class="bg-purple-100 p-4 rounded-xl mb-8 border border-purple-200 text-purple-800 shadow-sm">
                                    <strong><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>AI Detective Discovered:</strong> A trip to <b>${statusData.destination}</b> for ${statusData.days} days (Budget: ₹${statusData.budget})
                                </div>
                            `;
                        } else {
                            document.getElementById('aiDiscoveryBox').innerHTML = '';
                        }

                        const parsedDays = parseAIOutput(statusData.itinerary);
                        let timelineHtml = '';
                        parsedDays.forEach((item) => {
                            timelineHtml += `
                                <div class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active mt-4">
                                    <div class="flex items-center justify-center w-10 h-10 rounded-full border-4 border-white bg-blue-500 text-white shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10">
                                        <i class="fa-solid fa-map-pin text-sm"></i>
                                    </div>
                                    <div class="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] bg-white p-6 rounded-2xl shadow-md border border-gray-100">
                                        <h3 class="font-bold text-blue-700 text-xl capitalize mb-3">${item.day}</h3>
                                        <p class="text-gray-600 leading-relaxed">${item.desc}</p>
                                    </div>
                                </div>
                            `;
                        });
                        
                        document.getElementById('timeline').innerHTML = timelineHtml;
                        document.getElementById('statusContainer').classList.add('hidden');
                        document.getElementById('itineraryContainer').classList.remove('hidden');
                        
                        btnElement.disabled = false;
                        btnElement.innerHTML = `<span>${defaultBtnText}</span>`;
                        btnElement.classList.remove("opacity-70");
                    } else {
                        statusText.innerText = `Status: ${statusData.status} (Model is thinking...)`;
                    }
                } catch(err) {
                    clearInterval(statusChecker);
                    document.getElementById('statusText').innerText = "Error: Lost connection to backend.";
                    btnElement.disabled = false;
                    btnElement.innerHTML = `<span>${defaultBtnText}</span>`;
                    btnElement.classList.remove("opacity-70");
                }
            }, 2500);
        }

        async function submitStandardJob(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            
            try {
                btn.disabled = true;
                btn.classList.add("opacity-70");
                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
                document.getElementById('itineraryContainer').classList.add('hidden');
                document.getElementById('statusContainer').classList.remove('hidden');
                document.getElementById('statusText').innerText = "Job accepted! AI is generating your route...";

                const jobData = {
                    destination: document.getElementById('destination').value,
                    days: parseInt(document.getElementById('days').value),
                    budget: parseFloat(document.getElementById('budget').value)
                };

                const response = await fetch('http://localhost:8000/api/jobs', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(jobData)
                });
                
                if (!response.ok) throw new Error("Backend refused the connection.");
                const data = await response.json();
                
                startPolling(data.job_id, btn, 'Plan Another Trip');
            } catch(error) {
                alert("Connection Failed: Ensure your FastAPI server (uvicorn main:app --reload) is running!");
                btn.disabled = false;
                btn.classList.remove("opacity-70");
                btn.innerHTML = '<span>Generate Plan</span>';
            }
        }

        async function submitMagicJob(event) {
            event.preventDefault();
            const btn = document.getElementById('magicBtn');
            
            try {
                const url = document.getElementById('magicUrl').value;
                
                btn.disabled = true;
                btn.classList.add("opacity-70");
                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
                document.getElementById('itineraryContainer').classList.add('hidden');
                document.getElementById('statusContainer').classList.remove('hidden');
                document.getElementById('statusText').innerText = "Scraping link and discovering location...";

                const response = await fetch('http://localhost:8000/api/jobs/magic', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url })
                });
                
                if (!response.ok) throw new Error("Backend refused the connection.");
                const data = await response.json();
                
                startPolling(data.job_id, btn, 'Inspire Me');
            } catch(error) {
                alert("Connection Failed: Ensure your FastAPI server (uvicorn main:app --reload) is running!");
                btn.disabled = false;
                btn.classList.remove("opacity-70");
                btn.innerHTML = '<span>Inspire Me</span>';
            }
        }
    </script>
</body>
</html>
